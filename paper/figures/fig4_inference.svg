<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { fill: #222; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .ts { fill: #666; font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .c-teal rect { fill: rgba(29,158,117,0.10); stroke: #1D9E75; }
      .c-amber rect { fill: rgba(186,117,23,0.10); stroke: #BA7517; }
      .c-coral rect { fill: rgba(216,90,48,0.10); stroke: #D85A30; }
    </style>
  </defs>

  <!-- Title row -->
  <text class="th" x="340" y="24" text-anchor="middle">LCM inference as distribution transformation</text>

  <!-- COLUMN 1 -->
  <g class="c-teal">
    <rect x="30" y="44" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="115" y="62" text-anchor="middle" dominant-baseline="central">Prior P(S_t | T_t)</text>
    <text class="ts" x="115" y="79" text-anchor="middle" dominant-baseline="central">current narrative belief</text>
  </g>

  <rect x="42"  y="100" width="18" height="52" rx="2" fill="#1D9E75" opacity="0.35"/>
  <rect x="64"  y="112" width="18" height="40" rx="2" fill="#1D9E75" opacity="0.55"/>
  <rect x="86"  y="94"  width="18" height="58" rx="2" fill="#1D9E75" opacity="0.80"/>
  <rect x="108" y="108" width="18" height="44" rx="2" fill="#1D9E75" opacity="0.45"/>
  <rect x="130" y="118" width="18" height="34" rx="2" fill="#1D9E75" opacity="0.30"/>
  <rect x="152" y="126" width="18" height="26" rx="2" fill="#1D9E75" opacity="0.20"/>
  <text class="ts" x="115" y="165" text-anchor="middle">S1  S2  S3  S4  S5  S6</text>
  <text class="ts" x="115" y="178" text-anchor="middle" opacity="0.5">narrative state candidates</text>

  <line x1="200" y1="120" x2="248" y2="120" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="ts" x="224" y="112" text-anchor="middle" fill="#0F6E56">I_t arrives</text>

  <!-- COLUMN 2 -->
  <g class="c-amber">
    <rect x="252" y="44" width="176" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="62" text-anchor="middle" dominant-baseline="central">New information I_t</text>
    <text class="ts" x="340" y="79" text-anchor="middle" dominant-baseline="central">structured event input</text>
  </g>

  <rect x="252" y="100" width="176" height="78" rx="6" fill="none" stroke="rgba(120,120,120,0.35)" stroke-width="0.5"/>
  <text class="ts" x="266" y="118">event_id:   evt_20260330</text>
  <text class="ts" x="266" y="134">T07 (action):  sanction</text>
  <text class="ts" x="266" y="150">T10 (epistemic): 0.87</text>
  <text class="ts" x="266" y="166">T15 (conflict):  0.72</text>
  <text class="ts" x="340" y="192" text-anchor="middle" opacity="0.55">P(I_t | S_t+1) - likelihood</text>

  <line x1="428" y1="120" x2="476" y2="120" stroke="#BA7517" stroke-width="1.2" marker-end="url(#ar)"/>
  <text class="ts" x="452" y="112" text-anchor="middle" fill="#854F0B">Bayes</text>

  <!-- COLUMN 3 -->
  <g class="c-coral">
    <rect x="480" y="44" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="565" y="62" text-anchor="middle" dominant-baseline="central">Posterior P(S_t+1)</text>
    <text class="ts" x="565" y="79" text-anchor="middle" dominant-baseline="central">updated belief</text>
  </g>

  <rect x="492" y="120" width="18" height="32" rx="2" fill="#D85A30" opacity="0.25"/>
  <rect x="514" y="110" width="18" height="42" rx="2" fill="#D85A30" opacity="0.40"/>
  <rect x="536" y="96"  width="18" height="56" rx="2" fill="#D85A30" opacity="0.65"/>
  <rect x="558" y="84"  width="18" height="68" rx="2" fill="#D85A30" opacity="0.90"/>
  <rect x="580" y="112" width="18" height="40" rx="2" fill="#D85A30" opacity="0.38"/>
  <rect x="602" y="128" width="18" height="24" rx="2" fill="#D85A30" opacity="0.18"/>
  <text class="ts" x="565" y="165" text-anchor="middle">S1  S2  S3  S4  S5  S6</text>
  <text class="ts" x="565" y="178" text-anchor="middle" opacity="0.5">S4 becomes dominant</text>

  <!-- ROW 2 -->
  <rect x="30" y="206" width="620" height="52" rx="8" fill="none" stroke="rgba(120,120,120,0.35)" stroke-width="0.5"/>
  <text class="ts" x="340" y="226" text-anchor="middle">Bayesian update:</text>
  <text class="ts" x="340" y="245" text-anchor="middle" font-family="Menlo, Consolas, monospace">P(S_t+1) = (1/Z) * P(I_t | S_t+1) * Sigma P(S_t+1 | S_t) * P(S_t)</text>

  <!-- ROW 3 -->
  <g class="c-teal">
    <rect x="30" y="276" width="190" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="125" y="296" text-anchor="middle" dominant-baseline="central">Trajectory prediction</text>
    <text class="ts" x="125" y="314" text-anchor="middle" dominant-baseline="central">compute S_hat_t+1</text>
    <text class="ts" x="125" y="332" text-anchor="middle" dominant-baseline="central">in geometric space</text>
  </g>

  <line x1="220" y1="314" x2="243" y2="314" stroke="rgba(120,120,120,0.7)" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/>

  <g class="c-amber">
    <rect x="245" y="276" width="190" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="296" text-anchor="middle" dominant-baseline="central">Consistency check</text>
    <text class="ts" x="340" y="314" text-anchor="middle" dominant-baseline="central">d(S_hat, S_obs) vs epsilon</text>
    <text class="ts" x="340" y="332" text-anchor="middle" dominant-baseline="central">detect structural drift</text>
  </g>

  <line x1="435" y1="314" x2="458" y2="314" stroke="rgba(120,120,120,0.7)" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#ar)"/>

  <g class="c-coral">
    <rect x="460" y="276" width="190" height="76" rx="8" stroke-width="0.5"/>
    <text class="th" x="555" y="296" text-anchor="middle" dominant-baseline="central">Distribution update</text>
    <text class="ts" x="555" y="314" text-anchor="middle" dominant-baseline="central">refine P(S) via Bayes</text>
    <text class="ts" x="555" y="332" text-anchor="middle" dominant-baseline="central">update candidate set</text>
  </g>

  <!-- ROW 4 -->
  <rect x="30" y="372" width="620" height="88" rx="8" fill="none" stroke="rgba(120,120,120,0.35)" stroke-width="0.5"/>
  <text class="ts" x="50" y="392" opacity="0.55">Parallel hypothesis set {(S_i, h_i, P(S_i))}</text>

  <rect x="50"  y="402" width="110" height="44" rx="6" fill="none" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="105" y="420" text-anchor="middle" fill="#0F6E56">S4  h: a3f2...</text>
  <text class="ts" x="105" y="436" text-anchor="middle" fill="#085041">P = 0.61</text>

  <rect x="174" y="402" width="110" height="44" rx="6" fill="none" stroke="#534AB7" stroke-width="0.5"/>
  <text class="ts" x="229" y="420" text-anchor="middle" fill="#3C3489">S3  h: 7c19...</text>
  <text class="ts" x="229" y="436" text-anchor="middle" fill="#26215C">P = 0.24</text>

  <rect x="298" y="402" width="110" height="44" rx="6" fill="none" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="353" y="420" text-anchor="middle" fill="#5F5E5A">S5  h: 2d88...</text>
  <text class="ts" x="353" y="436" text-anchor="middle" fill="#444441">P = 0.10</text>

  <rect x="422" y="402" width="110" height="44" rx="6" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.5"/>
  <text class="ts" x="477" y="420" text-anchor="middle" opacity="0.4">S2  h: ...</text>
  <text class="ts" x="477" y="436" text-anchor="middle" opacity="0.4">P = 0.05</text>

  <text class="ts" x="570" y="424" text-anchor="middle" opacity="0.35">pruned</text>
  <text class="ts" x="570" y="440" text-anchor="middle" opacity="0.35">(below epsilon)</text>

  <text class="ts" x="340" y="469" text-anchor="middle" opacity="0.5">if d(S_t+1, E[S_t+1]) > epsilon -> structurally inconsistent transition detected</text>
</svg>
